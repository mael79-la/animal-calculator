<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Mascotas PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="calculator-card">
        <h1>🐾 Calculadora de Mascotas</h1>
        <p>Descubre la edad humana real de tu mejor amigo</p>
        
        <div class="input-group">
            <label for="pet-type">Selecciona tu mascota:</label>
            <select id="pet-type">
                <option value="dog">🐕 Perro</option>
                <option value="cat">🐈 Gato</option>
            </select>
        </div>

        <div class="input-group">
            <label for="pet-age">Edad de la mascota (en años):</label>
            <input type="number" id="pet-age" min="1" max="30" value="1">
        </div>

        <button id="btn-calculate">Calcular Edad Humana</button>

        <div id="result-box" class="result hidden">
            <p id="result-text"></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
